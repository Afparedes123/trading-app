services:
  backend:
    build: ./backend
    ports: ["8000:8000"]
    env_file: [.env]
    depends_on: [redis]
    volumes: ["./backend:/app"]
  frontend:
    build: ./frontend
    ports: ["3000:3000"]
    env_file: [.env]
    depends_on: [backend]
    volumes: ["./frontend:/app", "/app/node_modules", "/app/.next"]
  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
    volumes: ["redis_data:/data"]
volumes:
  redis_data:
